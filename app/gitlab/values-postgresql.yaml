global:
  defaultStorageClass: ${DEFAULT_STORAGE_CLASS}
  postgresql:
    auth:
      username: admin
      database: gitlabhq_production

clusterDomain: "cluster.local"
# 数据库HA和复制模式，使用几年下来效果并不理想，对于大部分需求来说，单节点足够了
architecture: standalone

primary:
  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 60
  readinessProbe:
    periodSeconds: 30
  extraEnvVars:
    - name: TZ
      value: Asia/Shanghai
  resources:
    requests:
      cpu: 200m
      memory: 2Gi
    limits:
      cpu: 2
      memory: 8Gi
  service:
    type: ClusterIP
  persistence:
    size: 50Gi

image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: 17.6.0-debian-12-r4
