global:
  defaultStorageClass: ${DEFAULT_STORAGE_CLASS}
  postgresql:
    auth:
      username: nextcloud
      database: nextcloud

clusterDomain: "cluster.local"
# 数据库HA和复制模式，使用几年下来效果并不理想，对于大部分需求来说，单节点足够了
architecture: standalone

primary:
  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 60
  readinessProbe:
    periodSeconds: 30
  extraEnvVars:
    - name: TZ
      value: Asia/Shanghai
  extendedConfiguration: |-
    shared_buffers = 256MB
    autovacuum_naptime = 30s
    autovacuum_vacuum_scale_factor = 0.05
    autovacuum_analyze_scale_factor = 0.02
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 4
      memory: 8Gi
  service:
    type: LoadBalancer
  persistence:
    size: 50Gi

image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: 17.6.0-debian-12-r4
