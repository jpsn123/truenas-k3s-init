global:
  nameOverride: ai-gateway

defaultPodOptions:
  securityContext:
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
  # /drainz 会阻塞到在途请求归零；需大于最长单请求时长(MODEL_REQUEST_TIMEOUT=10m)+收尾缓冲
  terminationGracePeriodSeconds: 660

controllers:
  ai-gateway:
    enabled: true
    # 多 controller 时 chart 会给资源名追加 -<identifier> 后缀，forceRename 固定资源名
    forceRename: ai-gateway
    type: deployment
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: "0"
      surge: 1
    replicas: 1
    # data PVC 为 ReadWriteOnce；滚动升级期间让临时新旧 Pod 落在同一节点，避免跨节点多重挂载失败
    pod:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: ai-gateway
                  app.kubernetes.io/controller: ai-gateway
              topologyKey: kubernetes.io/hostname
    containers:
      main:
        image:
          repository: ${IMAGE_REPOSITORY}
          tag: ${IMAGE_TAG}
          pullPolicy: IfNotPresent
        env:
          TZ: ${TIMEZONE}
          APP_ENV: production
          PORT: "8080"
          DASHBOARD_DIR: /app/frontend/dist
          PGSQL_IP: postgresql
          PGSQL_PORT: "5432"
          PGSQL_USER: ai-gateway
          PGSQL_DB: ai-gateway
          PGSQL_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: postgresql
                key: password
          AUTH_TOKEN_SIGNING_KEY:
            valueFrom:
              secretKeyRef:
                name: ai-gateway
                key: auth-token-signing-key
          CONFIG_ENCRYPTION_KEY:
            valueFrom:
              secretKeyRef:
                name: ai-gateway
                key: config-encryption-key
          LOG_LEVEL: info
          DB_LOG_LEVEL: warn
          REQUEST_LOG_RETENTION_DAYS: "30"
          REQUEST_FILE_RETENTION_DAYS: "7"
          REQUEST_FILE_COMPRESSION: "true"
          MODEL_REQUEST_TIMEOUT: 10m
          DEFAULT_PROVIDER_TIMEOUT: 30s
          STREAM_FIRST_EVENT_TIMEOUT: 30s
          PROVIDER_ERROR_RETRY_INTERVAL: 1m
          PROVIDER_PROBE_BACKOFF_AFTER_FAILURES: "3"
          PROVIDER_PROBE_DISABLE_AFTER_FAILURES: "10"
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /readyz
                port: 8080
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 3
              failureThreshold: 3
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: 8080
              initialDelaySeconds: 60
              periodSeconds: 60
              timeoutSeconds: 5
              failureThreshold: 2
        lifecycle:
          preStop:
            httpGet:
              path: /drainz
              port: 8080

  chat-agent:
    enabled: true
    forceRename: chat-agent
    type: deployment
    strategy: RollingUpdate
    rollingUpdate:
      unavailable: "0"
      surge: 1
    replicas: 1
    pod:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: ai-gateway
                  app.kubernetes.io/controller: chat-agent
              topologyKey: kubernetes.io/hostname
    containers:
      main:
        image:
          repository: ${CHAT_AGENT_IMAGE_REPOSITORY}
          tag: ${CHAT_AGENT_IMAGE_TAG}
          pullPolicy: IfNotPresent
        env:
          TZ: ${TIMEZONE}
          APP_ENV: production
          PORT: "8081"
          PGSQL_IP: postgresql
          PGSQL_PORT: "5432"
          PGSQL_USER: ai-gateway
          PGSQL_DB: chat
          PGSQL_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: postgresql
                key: password
          # Gateway Service 名称由 forceRename 固定为 ai-gateway
          GATEWAY_URL: http://ai-gateway:8080
          LOG_LEVEL: info
          DB_LOG_LEVEL: warn
          CHAT_MAX_TOOL_ROUNDS: "12"
          MODEL_REQUEST_TIMEOUT: 10m
          TOOL_REQUEST_TIMEOUT: 2m
          HTTP_READ_HEADER_TIMEOUT: 10s
          HTTP_IDLE_TIMEOUT: 2m
          HTTP_SHUTDOWN_TIMEOUT: 30s

service:
  ai-gateway:
    enabled: true
    primary: true
    forceRename: ai-gateway
    controller: ai-gateway
    type: ClusterIP
    ports:
      http:
        enabled: true
        primary: true
        port: 8080
  chat-agent:
    enabled: true
    forceRename: chat-agent
    controller: chat-agent
    type: ClusterIP
    ports:
      http:
        enabled: true
        port: 8081

ingress:
  main:
    enabled: true
    annotations:
      helm.sh/resource-policy: keep
      kubernetes.io/tls-acme: "true"
      cert-manager.io/cluster-issuer: ${DOMAIN}-letsencrypt-issuer
      nginx.ingress.kubernetes.io/proxy-read-timeout: "660"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "660"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
    className: "nginx"
    hosts:
      - host: ${SUB_DOMAIN}.${DOMAIN}
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: ai-gateway
              port: http
      - host: ${SUB_DOMAIN}.${DOMAIN}
        paths:
          - path: /chat
            pathType: Prefix
            service:
              identifier: chat-agent
              port: http
    tls:
      - hosts:
          - ${SUB_DOMAIN}.${DOMAIN}
        secretName: ${SUB_DOMAIN}.${DOMAIN}-tls

persistence:
  ai-gateway-data:
    enabled: true
    forceRename: ai-gateway-data
    type: persistentVolumeClaim
    storageClass: ${DEFAULT_STORAGE_CLASS}
    accessMode: ReadWriteOnce
    size: 300Gi
    retain: true
    advancedMounts:
      ai-gateway:
        main:
          - path: /app/data
            readOnly: false
  chat-agent-data:
    enabled: true
    forceRename: chat-agent-data
    type: persistentVolumeClaim
    storageClass: ${DEFAULT_STORAGE_CLASS}
    accessMode: ReadWriteOnce
    size: 500Gi
    retain: true
    advancedMounts:
      chat-agent:
        main:
          - path: /app/data
            readOnly: false
