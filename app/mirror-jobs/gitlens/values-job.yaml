apiVersion: batch/v1
kind: CronJob
metadata:
  name: mirror-gitlens
  namespace: ${NS}
  annotations:
    mirror-jobs/base-image: alpine:3.22
spec:
  schedule: "17 3 * * *"
  timeZone: ${TIMEZONE}
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sync
              image: ${JFROG_REGISTRY}/jutze/mirror-gitlens:1.1.2
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: ${SHARED_SECRET}
              env:
                - name: MIRROR_PATH
                  value: general/mirrors/gitlens
                - name: KEEP_VERSIONS
                  value: "3"
                - name: REQUEST_TIMEOUT
                  value: "300"
                - name: RELEASE_API
                  value: https://api.github.com/repos/gitkraken/vscode-gitlens/releases/latest
                - name: PUBLISHER
                  value: jutze
                - name: MAX_DOWNLOAD
                  value: "209715200"
                - name: MAX_UNPACKED
                  value: "536870912"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 2Gi
              volumeMounts:
                - name: temporary
                  mountPath: /tmp
          volumes:
            - name: temporary
              emptyDir:
                sizeLimit: 2Gi
