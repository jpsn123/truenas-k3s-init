global:
  defaultStorageClass: ${DEFAULT_STORAGE_CLASS}
  postgresql:
    auth:
      username: nocobase
      database: nocobase
      existingSecret: nocobase-db
      secretKeys:
        adminPasswordKey: password
        userPasswordKey: password

clusterDomain: "cluster.local"
architecture: standalone

primary:
  extendedConfiguration: |
    wal_level = logical
  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 60
  readinessProbe:
    periodSeconds: 30
  extraEnvVars:
    - name: TZ
      value: ${TIMEZONE}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1
      memory: 4Gi
  service:
    type: ClusterIP
  persistence:
    size: 200Gi

image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: 17.6.0-debian-12-r4
